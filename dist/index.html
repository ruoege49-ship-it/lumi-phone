<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#dce5ed">
  <meta name="description" content="聊天、朋友圈、日记与音乐，属于每个角色的轻玻璃小手机。">
  <title>轻玻璃 · 小手机</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='12' fill='%23364c80'/%3E%3Cpath d='M12 13h16v11H18l-6 5z' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="preload" href="assets/NotoSansSC.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="features.css">
  <script type="module" src="main.mjs"></script>
</head>
<body>
  <svg class="icon-library" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <symbol id="i-chat" viewBox="0 0 24 24"><path d="M20 11.5a8 8 0 0 1-8 8H4l1.8-3.6A8 8 0 1 1 20 11.5Z"/><path d="M8 10h8m-8 4h5"/></symbol>
      <symbol id="i-note" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="3"/><path d="M9 3v18m3-13h4m-4 4h4m-4 4h2"/></symbol>
      <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m3 17 5-5 4 4 4-6 5 7"/></symbol>
      <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="4"/><path d="M7 3v4m10-4v4M3 10h18m-14 4h2m4 0h2m-8 3h2"/></symbol>
      <symbol id="i-theme" viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 0 18c1.8 0 2.3-1.6 1.4-2.6-.8-1 .1-2.4 1.5-2.4H17a5 5 0 0 0 5-5c0-4.4-4.5-8-10-8Z"/><circle cx="7.5" cy="9" r=".7"/><circle cx="12" cy="7" r=".7"/><circle cx="17" cy="9" r=".7"/></symbol>
      <symbol id="i-music" viewBox="0 0 24 24"><path d="M9 18V6l11-3v12M9 10l11-3"/><ellipse cx="6" cy="18" rx="3" ry="2.5"/><ellipse cx="17" cy="15" rx="3" ry="2.5"/></symbol>
      <symbol id="i-heart" viewBox="0 0 24 24"><path d="m12 20-8-8C-1 6 7 0 12 7c5-7 13-1 8 5Z"/></symbol>
      <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M5 3v5m0 4v9M12 3v10m0 4v4m7-18v3m0 4v11"/><rect x="3" y="8" width="4" height="4" rx="1.5"/><rect x="10" y="13" width="4" height="4" rx="1.5"/><rect x="17" y="6" width="4" height="4" rx="1.5"/></symbol>
      <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14m-6-6 6 6-6 6"/></symbol>
      <symbol id="i-back" viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol>
      <symbol id="i-edit" viewBox="0 0 24 24"><path d="m15 4 5 5M4 20l5-1L21 7a2.1 2.1 0 0 0-4-4L5 15Z"/></symbol>
      <symbol id="i-play" viewBox="0 0 24 24"><path d="m9 5 11 7-11 7Z" fill="currentColor" stroke="none"/></symbol>
      <symbol id="i-pause" viewBox="0 0 24 24"><path d="M8 5v14M16 5v14" stroke-width="4"/></symbol>
      <symbol id="i-replay" viewBox="0 0 24 24"><path d="M4 10a8 8 0 1 1 1 8M4 4v6h6"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
      <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1 1m12 12 1 1M5 19l1-1M18 6l1-1"/></symbol>
      <symbol id="i-moon" viewBox="0 0 24 24"><path d="M21 13A9 9 0 0 1 11 3a9 9 0 1 0 10 10Z"/></symbol>
      <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12m-5-5 5 5 5-5M4 16v4h16v-4"/></symbol>
    </defs>
  </svg>

  <main class="studio">
    <header class="studio-heading"><span class="studio-mark">lumi.</span><span>轻玻璃小手机 <span class="edition">/ 02</span></span></header>
    <div class="phone" id="phone" data-theme="light" data-blur="true">
      <div class="wallpaper" aria-hidden="true"></div>
      <div class="reading-wash" aria-hidden="true"></div>
      <section class="view home-view" id="home-view" aria-label="小手机首页">
        <div class="home-pages" id="home-pages" tabindex="0" aria-label="手机桌面，左右翻页">
          <section class="home-page life-page" aria-label="生活桌面">
            <header class="date-strip"><button data-action="calendar" aria-label="打开约定日历"><b id="today-label"></b><span id="year-label"></span></button><ol id="week-strip" aria-label="本周日期"></ol></header>
            <div class="clock-area"><time id="home-clock">00:00</time></div>
            <section class="glass home-music" id="music-widget" aria-label="音乐组件">
              <button class="music-details" data-action="music" aria-label="打开音乐播放器"><img class="album-mini" src="assets/portrait-birds.png" alt="飞鸟插画封面"><span><strong id="home-song-title">午后片刻</strong><small id="home-listening-label">音乐与一起听</small></span></button>
              <button class="play-button" data-action="play" aria-label="播放样品轻音"><svg class="icon"><use href="#i-play"/></svg></button>
              <div class="music-progress" aria-hidden="true"><span data-progress></span></div>
              <div class="track-times"><span data-elapsed>0:00</span><span data-duration>0:24</span></div>
            </section>
            <nav class="app-grid home-apps" aria-label="生活应用">
              <button class="app" data-action="chat"><span class="app-tile"><svg class="icon"><use href="#i-chat"/></svg></span><span>消息</span></button>
              <button class="app" data-action="moments"><span class="app-tile"><svg class="icon"><use href="#i-sun"/></svg></span><span>朋友圈</span></button>
              <button class="app" data-action="diary"><span class="app-tile"><svg class="icon"><use href="#i-note"/></svg></span><span>日记</span></button>
              <button class="app" data-action="album"><span class="app-tile"><svg class="icon"><use href="#i-image"/></svg></span><span>相册</span></button>
            </nav>
          </section>
          <section class="home-page manage-page" aria-label="管理桌面">
            <header class="manage-heading"><p>管理</p><h2>角色与设置</h2></header>
            <button class="phone-profile" data-action="profile" aria-label="切换角色手机"><img class="avatar" data-avatar alt="林屿的头像"><span id="home-role-world">当前角色 · 日常</span><strong class="serif" data-character-name>林屿</strong></button>
            <nav class="app-grid home-apps" aria-label="管理应用">
              <button class="app" data-action="profile"><span class="app-tile"><svg class="icon"><use href="#i-heart"/></svg></span><span>角色</span></button>
              <button class="app" data-action="settings"><span class="app-tile"><svg class="icon"><use href="#i-sliders"/></svg></span><span>设置</span></button>
            </nav>
          </section>
        </div>
        <nav class="page-controls" aria-label="桌面翻页"><button data-home-page="0" aria-label="第1页：生活" aria-current="page"><span></span></button><button data-home-page="1" aria-label="第2页：管理"><span></span></button></nav>
      </section>
      <section class="view chat-view" id="chat-view" aria-label="聊天" hidden>
        <header class="chat-header glass"><button class="icon-button" data-action="chat-list" aria-label="返回会话列表"><svg class="icon"><use href="#i-back"/></svg></button><img class="avatar" id="chat-avatar" alt="聊天头像"><div class="chat-heading"><h1 id="chat-name">消息</h1><p id="chat-status">对话保存在本机</p></div><button class="icon-button" data-action="chat-options" aria-label="会话设置">···</button></header>
        <div class="message-list" id="message-list" tabindex="0" aria-label="聊天记录"></div>
        <div class="composer-area">
          <div class="quick-replies" aria-label="聊天工具"><button data-action="attachments">图片与表情</button><button data-action="record">录音</button><button data-action="respond">选择回复者</button><button data-action="chat-search">搜索与收藏</button></div>
          <div id="draft-attachments" class="draft-attachments"></div>
          <form class="composer glass" id="composer"><label class="sr-only" for="message-input">聊天消息</label><textarea id="message-input" rows="1" maxlength="4000" placeholder="慢慢说，我在听…"></textarea><button class="send-button" type="submit" aria-label="发送消息"><svg class="icon"><use href="#i-arrow"/></svg></button></form>
          <div class="composer-foot"><span id="draft-status">对话保存在本机</span><span>Enter 发送 · Shift + Enter 换行</span></div>
        </div>
      </section>
      <div class="home-indicator" aria-hidden="true"></div>
    </div>
    <footer class="studio-footer"><span class="live-dot"></span>轻玻璃小手机<span>·</span>本机保存</footer>
  </main>
  <dialog id="sheet" class="sheet" aria-labelledby="sheet-title"><header class="sheet-header"><div><p id="sheet-kicker"></p><h2 id="sheet-title"></h2></div><button class="icon-button" id="close-sheet" aria-label="关闭面板"><svg class="icon"><use href="#i-close"/></svg></button></header><div id="sheet-body" class="sheet-body"></div></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <audio id="audio" src="assets/afternoon.wav" preload="metadata"></audio>
</body>
</html>
